<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="db-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B5FFF" />
      <stop offset="100%" stop-color="#0040C1" />
    </linearGradient>
    <linearGradient id="db-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B86A" />
      <stop offset="100%" stop-color="#0E854B" />
    </linearGradient>
    <linearGradient id="db-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#F6B800" />
    </linearGradient>
    <linearGradient id="db-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B5FFF" />
      <stop offset="60%" stop-color="#14B86A" />
      <stop offset="100%" stop-color="#F6B800" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="db-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon (Left side) -->
  <g transform="translate(10, 10)">
    <!-- Outer AI Tech Hexagon Ring -->
    <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="none" stroke="url(#db-blue-grad)" stroke-width="3" stroke-dasharray="6,4" opacity="0.6"/>
    
    <!-- Stylized Mountain Peaks of Northwest (A1 & Pha Din) -->
    <path d="M 20 72 L 40 38 L 52 56 L 68 30 L 82 72 Z" fill="url(#db-emerald-grad)" opacity="0.85"/>
    <path d="M 32 72 L 52 42 L 64 60 L 78 72 Z" fill="url(#db-blue-grad)" opacity="0.9"/>

    <!-- Historic Victory Star / AI Spark on Peak -->
    <polygon points="68,14 71,22 79,22 73,27 75,35 68,30 61,35 63,27 57,22 65,22" fill="url(#db-gold-grad)" filter="url(#db-glow)"/>

    <!-- Neural Network Node Points & Connections -->
    <circle cx="50" cy="5" r="4" fill="#0B5FFF"/>
    <circle cx="90" cy="28" r="4" fill="#14B86A"/>
    <circle cx="90" cy="72" r="4" fill="#F6B800"/>
    <circle cx="50" cy="95" r="4" fill="#0B5FFF"/>
    <circle cx="10" cy="72" r="4" fill="#14B86A"/>
    <circle cx="10" cy="28" r="4" fill="#0B5FFF"/>
    
    <line x1="50" y1="5" x2="68" y2="14" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="90" y1="28" x2="68" y2="30" stroke="#14B86A" stroke-width="1.5"/>
    <line x1="10" y1="28" x2="40" y2="38" stroke="#0B5FFF" stroke-width="1.5"/>
  </g>

  <!-- Typography Text (Right side) -->
  <g transform="translate(115, 68)">
    <!-- Dienbien -->
    <text font-family="'Poppins', 'Inter', sans-serif" font-weight="800" font-size="44" fill="#0B5FFF" letter-spacing="-1">DIENBIEN</text>
    <!-- .today -->
    <text x="215" y="0" font-family="'Poppins', 'Inter', sans-serif" font-weight="700" font-size="44" fill="url(#db-emerald-grad)" letter-spacing="-1">.TODAY</text>
    <!-- AI Subtitle badge -->
    <g transform="translate(0, 18)">
      <rect x="0" y="-14" width="220" height="20" rx="10" fill="#0B5FFF" opacity="0.08"/>
      <text x="10" y="0" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#0B5FFF" letter-spacing="1.5">DIGITAL CITY BRAND • AI</text>
      <!-- Sparkle icon -->
      <polygon points="205,-6 207,-2 211,-2 208,1 209,5 205,3 201,5 202,1 199,-2 203,-2" fill="#F6B800"/>
    </g>
  </g>
</svg>
