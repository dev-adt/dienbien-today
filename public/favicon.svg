<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B5FFF" />
      <stop offset="100%" stop-color="#0040C1" />
    </linearGradient>
    <linearGradient id="fav-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B86A" />
      <stop offset="100%" stop-color="#0E854B" />
    </linearGradient>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#F6B800" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0E1320"/>

  <g transform="translate(0,0)">
    <!-- Outer AI Tech Hexagon Ring -->
    <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" fill="none" stroke="url(#fav-blue)" stroke-width="2.5" stroke-dasharray="5,3" opacity="0.7"/>
    
    <!-- Mountain Peaks -->
    <path d="M 22 70 L 40 40 L 52 56 L 68 32 L 80 70 Z" fill="url(#fav-emerald)" opacity="0.85"/>
    <path d="M 32 70 L 52 44 L 64 60 L 76 70 Z" fill="url(#fav-blue)" opacity="0.9"/>

    <!-- Victory Star -->
    <polygon points="68,16 71,23 78,23 73,28 75,35 68,31 61,35 63,28 58,23 65,23" fill="url(#fav-gold)"/>

    <!-- Node Points -->
    <circle cx="50" cy="10" r="3.5" fill="#0B5FFF"/>
    <circle cx="85" cy="30" r="3.5" fill="#14B86A"/>
    <circle cx="85" cy="70" r="3.5" fill="#F6B800"/>
    <circle cx="50" cy="90" r="3.5" fill="#0B5FFF"/>
    <circle cx="15" cy="70" r="3.5" fill="#14B86A"/>
    <circle cx="15" cy="30" r="3.5" fill="#0B5FFF"/>
  </g>
</svg>
